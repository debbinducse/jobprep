    <script>
      (function() {
        try {
          var saved = localStorage.getItem('jobprep_theme');
          var theme = saved ? saved : 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
