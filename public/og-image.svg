<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1117" />
      <stop offset="100%" stop-color="#14171D" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="24" fill="none" stroke="#2D3139" stroke-width="2" />

  <!-- Top Badge -->
  <g transform="translate(80, 80)">
    <rect width="360" height="42" rx="21" fill="#1E232F" stroke="#2563EB" stroke-width="1.5" />
    <text x="180" y="26" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">
      BANGLADESH GOVT &amp; BANK EXAM ARCHIVE
    </text>
  </g>

  <!-- Main Title -->
  <text x="80" y="200" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
    Govt IT &amp; BankPrep Portal
  </text>

  <!-- Subtitle -->
  <text x="80" y="260" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600">
    Complete Solved Question Bank &amp; Exam Papers (2010–2026)
  </text>

  <!-- Description paragraph -->
  <text x="80" y="325" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    Bangladesh Bank · Combined Govt Banks · BPSC Ministry Assistant Programmer
  </text>
  <text x="80" y="360" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    Senior Officer (IT / General) · Officer (IT / Cash) · Computer Operator · Data Entry
  </text>

  <!-- 4 Pill Tags -->
  <g transform="translate(80, 420)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="50" rx="12" fill="#1E293B" stroke="#334155" />
    <text x="110" y="31" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle">
      ✓ 42 Full 200M Papers
    </text>

    <!-- Pill 2 -->
    <rect x="240" y="0" width="220" height="50" rx="12" fill="#1E293B" stroke="#334155" />
    <text x="350" y="31" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle">
      ✓ Step-by-Step Code &amp; SQL
    </text>

    <!-- Pill 3 -->
    <rect x="480" y="0" width="230" height="50" rx="12" fill="#1E293B" stroke="#334155" />
    <text x="595" y="31" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle">
      ✓ Preliminary 100-MCQ Sets
    </text>

    <!-- Pill 4 -->
    <rect x="730" y="0" width="200" height="50" rx="12" fill="#1E293B" stroke="#334155" />
    <text x="830" y="31" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle">
      ✓ Written Solutions
    </text>
  </g>

  <!-- Bottom Brand Footer -->
  <line x1="80" y1="520" x2="1120" y2="520" stroke="#1E293B" stroke-width="2" />
  <text x="80" y="565" fill="#64748B" font-family="-apple-system, sans-serif" font-size="16" font-weight="500">
    https://debbairagi.com.bd/jobprep/
  </text>
  <text x="1120" y="565" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="end">
    100% Verified Model Answers · 2010–2026 Archive
  </text>
</svg>
