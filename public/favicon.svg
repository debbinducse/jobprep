<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="bank-it-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="32" height="32" rx="7" fill="url(#bank-it-grad)" />
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.25" stroke="#10b981" stroke-opacity="0.35" stroke-width="1.5" />
  
  <!-- Bank Pediment / Roof Roof Triangle -->
  <polygon points="16,5.5 25,10.5 7,10.5" fill="url(#gold-accent)" />
  <rect x="8" y="11" width="16" height="1.5" rx="0.5" fill="#f8fafc" />
  
  <!-- Bank Pillars / Code Columns -->
  <rect x="9.5" y="13.5" width="2" height="7" rx="0.75" fill="#f8fafc" />
  <rect x="15" y="13.5" width="2" height="7" rx="0.75" fill="#f8fafc" />
  <rect x="20.5" y="13.5" width="2" height="7" rx="0.75" fill="#f8fafc" />
  
  <!-- Bank Plinth / Base Foundation -->
  <rect x="7" y="21.5" width="18" height="2" rx="0.75" fill="#f8fafc" />
  
  <!-- IT Terminal / Code Symbol Pulse in the Center Base -->
  <circle cx="16" cy="26" r="1.5" fill="#34d399" />
  <circle cx="21" cy="26" r="1" fill="#38bdf8" />
  <circle cx="11" cy="26" r="1" fill="#fbbf24" />
</svg>
